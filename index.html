<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BB-OIL Services</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1930;
    --panel:#102847;
    --panel-raised:#163459;
    --panel-raised-2:#1C4068;
    --steel:#35547D;
    --chalk:#EAF1F8;
    --chalk-dim:#9FB4CE;
    --chalk-faint:#6D84A3;
    --surface:#FFFFFF;
    --surface-alt:#EEF3F9;
    --surface-border:#E1E7EF;
    --surface-border-strong:#CDD9E6;
    --text-dark:#132A4A;
    --text-dark-dim:#51698C;
    --text-dark-faint:#8CA0BC;
    --amber:#F3801E;
    --amber-dim:rgba(243,128,30,0.14);
    --red:#E5484D;
    --red-dim:rgba(229,72,77,0.12);
    --green:#2E9464;
    --green-dim:rgba(46,148,100,0.13);
    --line-chrome:rgba(234,241,248,0.10);
    --line-chrome-strong:rgba(234,241,248,0.18);
    --display:'Rajdhani',sans-serif;
    --body:'IBM Plex Sans',sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  [hidden]{display:none !important;}
  body{
    background:var(--surface-alt);
    color:var(--text-dark);
    font-family:var(--body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber);color:#fff;}
  button{font-family:var(--body);cursor:pointer;}
  input,select,textarea{font-family:var(--body);}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .app{display:flex;flex-direction:column;min-height:100vh;}

  /* ---------- Topbar (dark chrome) ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 28px;flex-wrap:wrap;gap:10px;
    border-bottom:1px solid var(--line-chrome);
    background:var(--ink);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:1.5px;color:var(--chalk);}
  .brand-mark{width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
  .brand-tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:2px 6px;margin-inline-start:6px;text-transform:uppercase;}
  .role-tag{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--chalk-dim);border:1px solid var(--line-chrome-strong);border-radius:3px;padding:2px 6px;margin-inline-start:6px;text-transform:uppercase;}
  .topbar-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  /* Buttons default to the light/white context (content area, modals) */
  .btn{
    border:1px solid var(--surface-border-strong);background:var(--surface-alt);color:var(--text-dark);
    padding:9px 16px;border-radius:6px;font-size:13.5px;font-weight:500;
    transition:border-color .15s ease, transform .1s ease, background .15s ease;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:var(--text-dark-faint);background:var(--surface-border);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-primary{background:var(--amber);color:#fff;border-color:var(--amber);font-weight:600;}
  .btn-primary:hover{background:#FF9A42;border-color:#FF9A42;}
  .btn-danger{color:var(--red);border-color:rgba(229,72,77,0.4);background:transparent;}
  .btn-danger:hover{background:var(--red-dim);}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--text-dark-dim);}
  .btn-ghost:hover{color:var(--text-dark);background:var(--surface-border);}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn-block{width:100%;justify-content:center;}

  /* Buttons living in the dark topbar/sidebar chrome get the dark-context look */
  .topbar .btn, .db-pill{
    border-color:var(--line-chrome-strong);background:var(--panel-raised);color:var(--chalk);
  }
  .topbar .btn:hover{border-color:var(--chalk-faint);background:var(--panel-raised-2);}
  .topbar .btn-ghost{background:transparent;border-color:transparent;color:var(--chalk-dim);}
  .topbar .btn-ghost:hover{color:var(--chalk);background:var(--panel-raised);}
  .topbar .btn-primary{background:var(--amber);color:#fff;border-color:var(--amber);}
  .topbar .btn-primary:hover{background:#FF9A42;border-color:#FF9A42;}

  .db-pill{
    display:inline-flex;align-items:center;gap:7px;
    border-radius:20px;padding:6px 13px 6px 10px;
    font-size:12.5px;
  }
  .db-pill:hover{border-color:var(--chalk-faint);}

  .lang-switch{display:flex;gap:2px;background:var(--panel-raised);border:1px solid var(--line-chrome-strong);border-radius:20px;padding:3px;}
  .lang-switch button{
    background:transparent;border:none;color:var(--chalk-dim);padding:5px 10px;border-radius:16px;
    font-family:var(--mono);font-size:11px;letter-spacing:0.5px;font-weight:600;
  }
  .lang-switch button.active{background:var(--amber);color:#fff;}
  .lang-switch button:hover:not(.active){color:var(--chalk);}

  /* ---------- Body layout ---------- */
  .body{display:flex;flex:1;min-height:0;}
  .sidebar{
    width:270px;flex-shrink:0;border-inline-end:1px solid var(--line-chrome);
    padding:20px 14px;display:flex;flex-direction:column;gap:6px;
    background:var(--ink);color:var(--chalk);
  }
  .sidebar-section-label{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--chalk-faint);text-transform:uppercase;padding:0 8px 8px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:7px;
    color:var(--chalk-dim);font-size:14px;font-weight:500;border:1px solid transparent;
  }
  .nav-item:hover{background:var(--panel);cursor:pointer;}
  .nav-item.active{background:var(--panel-raised);color:var(--chalk);border-color:var(--line-chrome-strong);}
  .nav-icon{width:16px;height:16px;flex-shrink:0;opacity:.85;}

  .vehicle-list{display:flex;flex-direction:column;gap:4px;margin-top:2px;}
  .vehicle-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 10px;border-radius:7px;border:1px solid transparent;cursor:pointer;
  }
  .vehicle-item:hover{background:var(--panel);}
  .vehicle-item.active{background:var(--panel-raised);border-color:var(--line-chrome-strong);}
  .vehicle-item-main{display:flex;flex-direction:column;min-width:0;}
  .vehicle-item-name{font-size:14px;font-weight:600;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vehicle-item-sub{font-size:11.5px;color:var(--chalk-faint);font-family:var(--mono);}
  .status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .dot-green{background:var(--green);box-shadow:0 0 0 3px var(--green-dim);}
  .dot-amber{background:var(--amber);box-shadow:0 0 0 3px var(--amber-dim);}
  .dot-red{background:var(--red);box-shadow:0 0 0 3px var(--red-dim);}
  .dot-gray{background:var(--chalk-faint);}

  .add-vehicle-tile{
    margin-top:10px;border:1px dashed var(--line-chrome-strong);background:transparent;color:var(--chalk-dim);
    border-radius:7px;padding:11px;font-size:13px;text-align:start;
  }
  .add-vehicle-tile:hover{border-color:var(--amber);color:var(--amber);}
  .add-vehicle-tile:disabled{opacity:.4;cursor:not-allowed;}

  .main{flex:1;min-width:0;padding:26px 32px 60px;overflow-y:auto;background:var(--surface-alt);}
  .main-inner{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px;}

  /* ---------- Empty / login states ---------- */
  .empty-state{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:90px 20px 30px;color:var(--text-dark-dim);gap:14px;
  }
  .empty-state h2{font-family:var(--display);font-size:26px;color:var(--text-dark);margin:0;}
  .empty-state p{margin:0;max-width:400px;font-size:14px;line-height:1.6;}

  .auth-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;
    background:var(--ink);
  }
  .auth-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--surface-border);
    border-radius:14px;padding:30px 28px;color:var(--text-dark);
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--surface-border);}
  .auth-brand-mark{width:28px;height:28px;display:flex;align-items:center;justify-content:center;}
  .auth-brand-name{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:1.1px;color:var(--text-dark);}
  .auth-brand-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:1.7px;color:var(--amber);border:1px solid var(--amber);border-radius:3px;padding:2px 6px;text-transform:uppercase;}
  .auth-card h2{font-family:var(--display);font-size:24px;margin:0 0 4px;}
  .auth-card .sub{font-size:13px;color:var(--text-dark-dim);margin-bottom:22px;line-height:1.5;}
  .auth-toggle{display:flex;gap:6px;background:var(--surface-alt);border-radius:8px;padding:4px;margin-bottom:20px;}
  .auth-toggle button{flex:1;background:transparent;border:none;color:var(--text-dark-dim);padding:8px;border-radius:6px;font-size:13px;font-weight:500;}
  .auth-toggle button.active{background:var(--surface);color:var(--text-dark);box-shadow:0 1px 3px rgba(19,42,74,0.15);}

  /* ---------- Setup card ---------- */
  .setup-card{
    background:var(--surface);border:1px solid var(--surface-border);border-radius:12px;
    padding:22px 24px;max-width:640px;margin:20px auto 0;
  }

  /* ---------- Vehicle heading ---------- */
  .vehicle-heading{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .vehicle-heading h1{font-family:var(--display);font-weight:700;font-size:34px;margin:0;letter-spacing:.3px;color:var(--text-dark);}
  .vehicle-sub{font-family:var(--mono);font-size:12.5px;color:var(--text-dark-dim);margin-top:4px;letter-spacing:.5px;}
  .vehicle-actions{display:flex;gap:8px;}

  /* ---------- Cluster / gauge panel ---------- */
  .cluster-panel{
    background:var(--surface);
    border:1px solid var(--surface-border);border-radius:14px;padding:26px 28px;
    box-shadow:0 1px 3px rgba(19,42,74,0.06);
  }
  .cluster-row{display:flex;align-items:center;gap:36px;margin-top:18px;flex-wrap:wrap;}
  .gauge-wrap{flex-shrink:0;width:260px;}
  .gauge-caption{text-align:center;margin-top:2px;}
  .gauge-caption .gc-title{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--text-dark-faint);text-transform:uppercase;}
  .gauge-caption .gc-value{font-family:var(--display);font-size:20px;font-weight:600;margin-top:2px;}

  .odometer-wrap{flex:1;min-width:230px;display:flex;flex-direction:column;gap:10px;}
  .odometer-label{font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--text-dark-faint);text-transform:uppercase;}
  .odometer{display:flex;gap:5px;direction:ltr;}
  .odo-digit{
    background:#0A1930;border:1px solid var(--ink);border-radius:5px;
    width:38px;height:52px;display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:26px;font-weight:600;color:var(--amber);
    box-shadow:inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .odo-unit{align-self:flex-end;font-family:var(--mono);font-size:12px;color:var(--text-dark-faint);margin-left:2px;}
  .mileage-form{display:flex;gap:8px;margin-top:4px;}
  .mileage-form input{
    background:var(--surface-alt);border:1px solid var(--surface-border-strong);color:var(--text-dark);
    padding:9px 11px;border-radius:6px;font-size:13.5px;width:150px;
  }

  /* ---------- Reminders ---------- */
  .section-title{font-family:var(--display);font-size:19px;font-weight:600;margin:0 0 12px;letter-spacing:.3px;color:var(--text-dark);}
  .reminder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .reminder-card{
    border:1px solid var(--surface-border);background:var(--surface);border-radius:10px;padding:14px 15px;
    border-left:3px solid var(--text-dark-faint);
    box-shadow:0 1px 3px rgba(19,42,74,0.05);
  }
  .reminder-card.status-ok{border-left-color:var(--green);}
  .reminder-card.status-soon{border-left-color:var(--amber);}
  .reminder-card.status-overdue{border-left-color:var(--red);}
  .reminder-card.status-none{border-left-color:var(--surface-border-strong);opacity:.85;}
  .reminder-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .reminder-type{font-size:14px;font-weight:600;color:var(--text-dark);}
  .reminder-badge{font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:20px;}
  .badge-ok{background:var(--green-dim);color:var(--green);}
  .badge-soon{background:var(--amber-dim);color:var(--amber);}
  .badge-overdue{background:var(--red-dim);color:var(--red);}
  .badge-none{background:var(--surface-alt);color:var(--text-dark-faint);}
  .reminder-detail{font-size:12px;color:var(--text-dark-dim);margin-top:8px;line-height:1.5;font-family:var(--mono);}
  .reminder-bar{height:4px;border-radius:3px;background:var(--surface-alt);margin-top:10px;overflow:hidden;}
  .reminder-bar-fill{height:100%;border-radius:3px;}

  /* ---------- History ---------- */
  .history-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .history-controls{display:flex;gap:8px;flex-wrap:wrap;}
  .history-controls select,.history-controls input{
    background:var(--surface);border:1px solid var(--surface-border-strong);color:var(--text-dark);
    padding:8px 10px;border-radius:6px;font-size:13px;
  }
  .table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;}
  .history-table{width:100%;min-width:560px;border-collapse:collapse;font-size:13.5px;background:var(--surface);border:1px solid var(--surface-border);border-radius:10px;overflow:hidden;}
  .history-table thead th{
    text-align:start;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--text-dark-faint);padding:12px 12px 10px;border-bottom:1px solid var(--surface-border);font-weight:500;
  }
  .history-table tbody td{padding:13px 12px;border-bottom:1px solid var(--surface-border);vertical-align:top;color:var(--text-dark);}
  .history-table tbody tr:last-child td{border-bottom:none;}
  .history-table tbody tr:hover{background:var(--surface-alt);}
  .hist-type{font-weight:600;}
  .hist-notes{color:var(--text-dark-dim);max-width:260px;}
  .hist-actions{display:flex;gap:6px;justify-content:flex-end;}
  .row-actions-cell{text-align:end;}
  .empty-row td{text-align:center;color:var(--text-dark-faint);padding:40px 10px;font-size:13px;}

  /* ---------- Overview ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .stat-card{background:var(--surface);border:1px solid var(--surface-border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 3px rgba(19,42,74,0.05);}
  .stat-card .num{font-family:var(--display);font-size:32px;font-weight:700;color:var(--text-dark);}
  .stat-card .lbl{font-family:var(--mono);font-size:11px;letter-spacing:1.5px;color:var(--text-dark-faint);text-transform:uppercase;margin-top:2px;}
  .stat-card.stat-red .num{color:var(--red);}
  .stat-card.stat-amber .num{color:var(--amber);}
  .stat-card.stat-green .num{color:var(--green);}

  .alert-list{display:flex;flex-direction:column;gap:8px;}
  .alert-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--surface-border);
    border-radius:9px;padding:12px 14px;cursor:pointer;
    box-shadow:0 1px 3px rgba(19,42,74,0.05);
  }
  .alert-row:hover{border-color:var(--surface-border-strong);}
  .alert-row .status-dot{width:9px;height:9px;}
  .alert-main{flex:1;min-width:0;}
  .alert-veh{font-size:13px;font-weight:600;color:var(--text-dark);}
  .alert-type{font-size:12.5px;color:var(--text-dark-dim);}
  .alert-when{font-family:var(--mono);font-size:11.5px;color:var(--text-dark-faint);white-space:nowrap;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,25,48,0.55);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-card{
    background:var(--surface);border:1px solid var(--surface-border);border-radius:12px;color:var(--text-dark);
    width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:24px 26px 22px;
    box-shadow:0 20px 60px rgba(10,25,48,0.35);
  }
  .modal-card.wide{max-width:600px;}
  .modal-title{font-family:var(--display);font-size:22px;font-weight:700;margin:0 0 4px;color:var(--text-dark);}
  .modal-sub{font-size:12.5px;color:var(--text-dark-faint);margin-bottom:18px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dark-dim);}
  .field input,.field select,.field textarea{
    background:var(--surface-alt);border:1px solid var(--surface-border-strong);color:var(--text-dark);
    padding:10px 11px;border-radius:6px;font-size:14px;width:100%;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .field textarea.mono{font-family:var(--mono);font-size:12.5px;min-height:130px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .interval-row{display:flex;gap:8px;align-items:flex-end;}
  .interval-row .field{flex:1;margin-bottom:0;}
  .interval-row select{width:110px;flex-shrink:0;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .modal-error{color:var(--red);font-size:12.5px;margin-bottom:10px;display:none;white-space:pre-wrap;}
  .modal-note{background:var(--surface-alt);border:1px solid var(--surface-border);border-radius:8px;padding:12px 14px;font-size:12.5px;color:var(--text-dark-dim);line-height:1.7;margin-bottom:16px;}
  .modal-note ol{margin:6px 0 0;padding-left:18px;}
  .modal-note code{color:var(--amber);font-family:var(--mono);}
  .status-line{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:16px;color:var(--text-dark);}
  .guess-line{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .guess-note{font-size:11.5px;color:var(--text-dark-faint);font-family:var(--mono);}

  .hint{font-size:11.5px;color:var(--text-dark-faint);margin-top:-2px;}

  /* ---------- Responsive: tablet / narrow desktop ---------- */
  @media (max-width:980px){
    .main-inner{max-width:100%;}
  }

  @media (max-width:900px){
    .topbar{padding:14px 18px;}
    .topbar-actions{gap:8px;}
  }

  @media (max-width:820px){
    .body{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-inline-end:none;border-bottom:1px solid var(--line-chrome);padding:12px 14px;}
    .sidebar-section-label{display:none;}
    .vehicle-list{flex-direction:row;}
    .vehicle-item{flex-shrink:0;}
    .add-vehicle-tile{flex-shrink:0;margin-top:0;white-space:nowrap;}
    .main{padding:20px 16px 50px;}
    .cluster-row{gap:20px;}
  }

  /* ---------- Responsive: phones ---------- */
  @media (max-width:680px){
    .topbar{padding:12px 14px;gap:8px;}
    .brand{font-size:18px;gap:8px;}
    .brand-mark{width:22px;height:22px;}
    .brand-mark svg{width:20px;height:20px;}
    .brand-tag{display:none;}
    .topbar-actions{gap:6px;width:100%;justify-content:flex-start;}
    .topbar .btn{padding:7px 12px;font-size:12.5px;}
    .db-pill{padding:5px 11px 5px 9px;font-size:12px;}
    .lang-switch{padding:2px;}
    .lang-switch button{padding:4px 8px;font-size:10.5px;}

    .main{padding:16px 12px 44px;}
    .main-inner{gap:20px;}

    .vehicle-heading{gap:10px;}
    .vehicle-heading h1{font-size:25px;}
    .vehicle-actions{width:100%;}
    .vehicle-actions .btn{flex:1;justify-content:center;}

    .cluster-panel{padding:18px 16px;border-radius:12px;}
    .cluster-row{flex-direction:column;gap:22px;}

    .setup-card{padding:18px 16px;margin-top:12px;}

    .stat-row{grid-template-columns:repeat(2,1fr);}
    .reminder-grid{grid-template-columns:1fr;}

  function loadLang(){
    try{
      var s = localStorage.getItem('pitlane_lang');
      if(s && TRANSLATIONS[s]) return s;
    }catch(e){}
    return 'en';
  }
  function saveLang(lang){
    try{ localStorage.setItem('pitlane_lang', lang); }catch(e){}
  }
  function loadSavedSettings(){
    try{
      var saved = localStorage.getItem('pitlane_station_settings');
      if(saved){
        var parsed = JSON.parse(saved);
        if(parsed && typeof parsed === 'object'){ return Object.assign({stationName:"Your Station Name", tagline:"Service Log", phone:""}, parsed); }
      }
    }catch(e){}
    return {stationName:"Your Station Name", tagline:"Service Log", phone:""};
  }
  function saveSavedSettings(settings){
    try{
      localStorage.setItem('pitlane_station_settings', JSON.stringify(settings || {}));
    }catch(e){}
  }
  function t(key, vars){
    var dict = TRANSLATIONS[state.lang] || TRANSLATIONS.en;
    var str = dict[key] != null ? dict[key] : (TRANSLATIONS.en[key] != null ? TRANSLATIONS.en[key] : key);
    if(vars){
      Object.keys(vars).forEach(function(k){
        str = str.split('{'+k+'}').join(vars[k]);
      });
    }
    return str;
  }
  function localeCode(){
    return state.lang === 'ar' ? 'ar-u-nu-latn' : (state.lang === 'fr' ? 'fr' : 'en');
  }

    lang: loadLang(),
    vehicles: [],
    records: [],

    user: null,
    role: null,          // 'admin' | 'customer' | null

  /* ============ Date helpers ============ */
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(iso){
    if(!iso) return "—";
    var d = new Date(iso+"T00:00:00");
    return d.toLocaleDateString(localeCode(),{year:'numeric',month:'short',day:'numeric'});
  }
  function addDays(iso, days){
    var d = new Date(iso+"T00:00:00");
    d.setDate(d.getDate()+days);
    return d.toISOString().slice(0,10);
  }
  function daysBetween(isoA, isoB){
    var a = new Date(isoA+"T00:00:00"), b = new Date(isoB+"T00:00:00");
    return Math.round((b-a)/86400000);
  }
  function fmtInterval(days){
    if(!days) return "—";
    if(days % 30 === 0 && days >= 60) return (days/30)+" months";
    if(days === 1) return "1 day";
    return days+" days";
  }

  /* ============ Domain logic ============ */
  function vehicleRecords(vehicleId){
    return state.records.filter(function(r){return r.vehicleId===vehicleId;})
      .sort(function(a,b){
        if(a.date !== b.date) return b.date.localeCompare(a.date); // most recent date first
        return b.mileage - a.mileage; // same-day tiebreaker
      });
  }

  // Estimate this vehicle's average km/day from its own service history.
  // Falls back to a typical average if there isn't enough history yet.
  function estimateKmPerDay(vehicleId){
    var recs = state.records.filter(function(r){return r.vehicleId===vehicleId;})
      .slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    if(recs.length >= 2){
      var first = recs[0], last = recs[recs.length-1];
      var days = daysBetween(first.date, last.date);
      var kmDelta = last.mileage - first.mileage;
      if(days > 0 && kmDelta > 0){
        return {kmPerDay: kmDelta/days, source:"history"};
      }
    }
    return {kmPerDay: 35, source:"fallback"}; // ~12,800 km/year, a typical average
  }

  function estimateIntervalDays(vehicleId, kmInterval){
    var est = estimateKmPerDay(vehicleId);
    var days = Math.max(1, Math.round(kmInterval / est.kmPerDay));
    return {days: days, kmPerDay: est.kmPerDay, source: est.source};
  }

  function serviceEntriesForVehicle(vehicle){
    var entries = SERVICE_TYPES.filter(function(st){return st.key!=="custom";}).map(function(st){
      return {key:st.key, label:typeLabel(st.key), isCustom:false};
    });
    var customLabels = Array.from(new Set(
      state.records.filter(function(r){return r.vehicleId===vehicle.id && r.typeKey==="custom";})
        .map(function(r){return r.customLabel || t('customWord');})
    ));
    customLabels.forEach(function(label){
      entries.push({key:"custom", label:label, isCustom:true});
    });
    return entries.map(function(e){
      var recsForEntry = vehicleRecords(vehicle.id).filter(function(r){
        if(e.isCustom) return r.typeKey==="custom" && (r.customLabel||t('customWord'))===e.label;
        return r.typeKey===e.key;
      });
      var status = "none", fraction=0, last=null, dueKm=null, dueDate=null;
      if(recsForEntry.length){
        last = recsForEntry[0];
        var dueK = last.mileage + last.intervalKm;
        var dueD = last.intervalDays ? addDays(last.date, last.intervalDays) : null;
        var mf = last.intervalKm>0 ? (vehicle.currentMileage-last.mileage)/last.intervalKm : 0;
        var df = 0;
        if(dueD){
          var span = daysBetween(last.date, dueD) || 1;
          var elapsed = daysBetween(last.date, todayISO());
          df = elapsed/span;
        }
        if(intervalUsesKmOnly(last)){
          fraction = mf;
        } else {
          fraction = Math.max(mf, df);
        }
        status = fraction>=1 ? "overdue" : (fraction>=0.85 ? "soon" : "ok");
        dueKm = dueK; dueDate = dueD;
      }
      return {key:e.key, label:e.label, isCustom:e.isCustom, status:status, fraction:Math.max(0,Math.min(fraction,1.4)), lastRecord:last, dueKm:dueKm, dueDate:dueDate};
    }).sort(function(a,b){ return b.fraction - a.fraction; });
  }

  function garageAlerts(){
    var alerts = [];
    state.vehicles.forEach(function(v){
      serviceEntriesForVehicle(v).forEach(function(e){
        if(e.status==="overdue" || e.status==="soon"){
          alerts.push({vehicle:v, entry:e});
        }
      });
    });
    alerts.sort(function(a,b){ return b.entry.fraction - a.entry.fraction; });
    return alerts;
  }

  // Groups vehicles by the customer they're registered to. There's no
  // separate "customers" collection — a customer is just whoever a
  // vehicle's customerEmail points at — so this derives the list live.
  function customersFromVehicles(){
    var groups = {};
    var order = [];
    state.vehicles.forEach(function(v){
      var email = (v.customerEmail||'').toLowerCase().trim();
      var key = email || ('__unlinked__' + v.id);
      if(!groups[key]){
        groups[key] = {
          email: email,
          name: v.customerName || (email ? email : "No customer linked"),
          phone: v.customerPhone || "",
          vehicles: [],
          linked: !!email
        };
        order.push(key);
      }
      groups[key].vehicles.push(v);
      // Prefer the most recently-seen non-empty name/phone across their vehicles.
      if(v.customerName) groups[key].name = v.customerName;
      if(v.customerPhone) groups[key].phone = v.customerPhone;
    });
    return order.map(function(k){ return groups[k]; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
  }

  /* ============ SVG Gauge ============ */
  function polar(cx,cy,r,angleDeg){
    var rad = angleDeg*Math.PI/180;
    return {x: cx + r*Math.cos(rad), y: cy - r*Math.sin(rad)};
  }
  function arcPath(cx,cy,r,startAngle,endAngle){
    var s = polar(cx,cy,r,startAngle);
    var e = polar(cx,cy,r,endAngle);
    var largeArc = (startAngle-endAngle) > 180 ? 1 : 0;
    return "M "+s.x+" "+s.y+" A "+r+" "+r+" 0 "+largeArc+" 1 "+e.x+" "+e.y;
  }
  function renderGauge(fraction, statusColorVar){
    fraction = Math.max(0, Math.min(fraction, 1));
    var cx=130, cy=118, r=96, strokeBg=14;
    var needleAngle = 180 - fraction*180;
    var needleR = r-20;
    var tip = polar(cx,cy,needleR,needleAngle);
    var base1 = polar(cx,cy,7,needleAngle+90);
    var base2 = polar(cx,cy,7,needleAngle-90);

    var segs = [
      {from:180, to:180-0.6*180, color:"var(--green)"},
      {from:180-0.6*180, to:180-0.85*180, color:"var(--amber)"},
      {from:180-0.85*180, to:0, color:"var(--red)"}
    ];
    var segMarkup = segs.map(function(s){
      return '<path d="'+arcPath(cx,cy,r,s.from,s.to)+'" stroke="'+s.color+'" stroke-width="'+strokeBg+'" fill="none" stroke-linecap="butt" opacity="0.9"/>';
    }).join("");

    var ticks = [];
    for(var i=0;i<=8;i++){
      var a = 180 - (i/8)*180;
      var p1 = polar(cx,cy,r+10,a);
      var p2 = polar(cx,cy,r+2,a);
      ticks.push('<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="#C7D3E2" stroke-width="1.5" opacity="0.8"/>');
    }

    return '<svg viewBox="0 0 260 150" width="100%" height="auto">'
      + '<path d="'+arcPath(cx,cy,r,180,0)+'" stroke="#EEF2F7" stroke-width="'+(strokeBg+6)+'" fill="none"/>'
      + segMarkup
      + ticks.join("")
      + '<line x1="'+base1.x+'" y1="'+base1.y+'" x2="'+tip.x+'" y2="'+tip.y+'" stroke="'+statusColorVar+'" stroke-width="4" stroke-linecap="round"/>'
      + '<line x1="'+base2.x+'" y1="'+base2.y+'" x2="'+tip.x+'" y2="'+tip.y+'" stroke="'+statusColorVar+'" stroke-width="4" stroke-linecap="round"/>'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="'+statusColorVar+'"/>'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="4" fill="var(--ink)"/>'
      + '</svg>';
  }

  function vehicleOverallStatus(vehicle){
    var entries = serviceEntriesForVehicle(vehicle).filter(function(e){return e.status!=="none";});
    if(entries.some(function(e){return e.status==="overdue";})) return "red";
    if(entries.some(function(e){return e.status==="soon";})) return "amber";
    if(entries.length) return "green";
    return "gray";
  }

        '<tbody id="historyBody"></tbody>'+
      '</table>'+
      '</div>'
    );
    histSection.appendChild(table);
    wrap.appendChild(histSection);

    setTimeout(function(){
      // A newer render() may have already replaced this DOM (e.g. a Firestore
      // snapshot fired while this callback was queued) — bail out quietly.
      // The wired-flag also stops duplicate listeners from stacking up if
      // render() fired more than once before any of these callbacks ran.
      var tbodyEl = document.getElementById('historyBody');
      if(!tbodyEl || tbodyEl.dataset.wired) return;
      tbodyEl.dataset.wired = '1';

      renderHistoryBody(v, recs);

      var filterEl = document.getElementById('filterType');
      var searchEl = document.getElementById('searchNotes');
      if(filterEl) filterEl.addEventListener('change', function(){ renderHistoryBody(v, recs); });
      if(searchEl) searchEl.addEventListener('input', function(){ renderHistoryBody(v, recs); });

      var addRecordBtn = document.getElementById('addRecordBtn');
      if(addRecordBtn) addRecordBtn.addEventListener('click', function(){ openAddRecordModal(v); });

      var mf = document.getElementById('mileageForm');

        mf.addEventListener('submit', function(e){
          e.preventDefault();

          if(isNaN(val) || val<0) return;
          fsUpdateVehicle(v.id, {currentMileage: val}).catch(function(err){ alertError('Could not update mileage', err); });
        });
      }
      var editBtn = document.getElementById('editVehicleBtn');
      if(editBtn) editBtn.addEventListener('click', function(){ openEditVehicleModal(v); });
      var delBtn = document.getElementById('deleteVehicleBtn');
      if(delBtn) delBtn.addEventListener('click', function(){ openConfirmDeleteVehicle(v); });
    },0);

    return wrap;

  function renderHistoryBody(v, recs){
    var tbody = document.getElementById('historyBody');
    var filterEl = document.getElementById('filterType');
    var searchEl = document.getElementById('searchNotes');
    if(!tbody || !filterEl || !searchEl) return;
    var typeFilter = filterEl.value;
    var search = searchEl.value.trim().toLowerCase();
    var filtered = recs.filter(function(r){
      if(typeFilter && r.typeKey!==typeFilter) return false;
      if(search && !(r.notes||"").toLowerCase().includes(search)) return false;
      return true;
    });
    tbody.innerHTML = "";
    if(!filtered.length){
      tbody.appendChild(el('<tr class="empty-row"><td colspan="5">'+(isAdmin()?t('noMatchingAdmin'):t('noMatchingCustomer'))+'</td></tr>'));
      return;
    }
    filtered.forEach(function(r){
      var typeName = r.typeKey==="custom" ? (r.customLabel||t('customWord')) : typeLabel(r.typeKey);
      var row = el(
        '<tr>'+
          '<td>'+fmtDate(r.date)+'</td>'+
          '<td>'+r.mileage.toLocaleString()+' km</td>'+
          '<td class="hist-type">'+escapeHtml(typeName)+'</td>'+
          '<td class="hist-notes">'+escapeHtml(r.notes||"—")+'</td>'+
          '<td class="row-actions-cell"><div class="hist-actions">'+
            (isAdmin() ? '<button class="btn btn-sm btn-ghost" data-act="edit">'+t('editBtn')+'</button><button class="btn btn-sm btn-danger" data-act="del">'+t('deleteBtn')+'</button>' : '')+
          '</div></td>'+
        '</tr>'
      );
      if(isAdmin()){
        row.querySelector('[data-act="edit"]').addEventListener('click', function(){ openEditRecordModal(v, r); });
        row.querySelector('[data-act="del"]').addEventListener('click', function(){
          if(confirm(t('deleteConfirmRecord'))){
            fsDeleteRecord(r.id).catch(function(err){ alertError('Could not delete record', err); });
          }
        });
      }
      tbody.appendChild(row);
    });
  }

  function openModal(html, onMount, wide){
    var overlay = document.getElementById('modalOverlay');
    var card = document.getElementById('modalCard');
    card.className = 'modal-card' + (wide ? ' wide' : '');
    card.innerHTML = html;
    overlay.hidden = false;
    if(onMount) onMount(card);
  }
  function closeModal(){
    document.getElementById('modalOverlay').hidden = true;
    document.getElementById('modalCard').innerHTML = "";
  }
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if(e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeModal();
  });
  function showModalError(card, msg){
    var err = card.querySelector('#modalError');
    if(!err) return;
    err.textContent = msg;
    err.style.display = "block";
  }
  function alertError(prefix, err){
    var msg = (err && err.message) ? err.message : String(err);
    var bar = document.createElement('div');
    bar.textContent = prefix + ': ' + msg;
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#E5484D;color:#fff;padding:10px 16px;font:13px/1.4 sans-serif;text-align:center;z-index:9999;';
    document.body.appendChild(bar);
    setTimeout(function(){ bar.remove(); }, 6000);
  }

  function intervalFieldHtml(defaultDays){
    var display = intervalDaysToDisplay(defaultDays);
    return (
      '<div class="field"><label>'+t('remindAgainAfter')+'</label>'+
      '<div class="interval-row">'+
        '<input id="f_intervalAmount" type="number" min="0" value="'+display.amount+'">'+
        '<select id="f_intervalUnit">'+
          '<option value="days" '+(display.unit==='days'?'selected':'')+'>'+t('daysUnit')+'</option>'+
          '<option value="months" '+(display.unit==='months'?'selected':'')+'>'+t('monthsUnit')+'</option>'+
        '</select>'+
      '</div></div>'
    );
  }
  function intervalAmountToDays(amount, unit){
    amount = parseInt(amount,10) || 0;
    return unit === 'months' ? amount * 30 : amount;
  }
  function intervalDaysToDisplay(days){
    days = parseInt(days,10) || 0;
    if(days >= 60 && days % 30 === 0){
      return {amount: Math.round(days / 30), unit: 'months'};
    }
    return {amount: days, unit: 'days'};
  }
  function readIntervalDays(card){
    var amount = parseInt(card.querySelector('#f_intervalAmount').value,10) || 0;
    var unit = card.querySelector('#f_intervalUnit').value;
    return intervalAmountToDays(amount, unit);
  }
  function setIntervalFields(card, days){
    var display = intervalDaysToDisplay(days);
    card.querySelector('#f_intervalUnit').value = display.unit;
    card.querySelector('#f_intervalAmount').value = display.amount;
  }
  function intervalUsesKmOnly(record){
    if(!record) return false;
    var intervalKm = Number(record.intervalKm) || 0;
    var intervalDays = Number(record.intervalDays) || 0;
    return intervalKm > 0 && intervalDays <= 0;
  }
  // Converts the on-screen number when the person switches the days/months
  // dropdown themselves, so picking "months" doesn't just relabel the same
  // raw number — it recalculates it to the equivalent duration.
  function wireIntervalUnitToggle(card){
    var unitSelect = card.querySelector('#f_intervalUnit');
    var amountInput = card.querySelector('#f_intervalAmount');
    var lastUnit = unitSelect.value;
    unitSelect.addEventListener('change', function(){
      var amount = parseInt(amountInput.value,10) || 0;
      if(lastUnit === 'days' && unitSelect.value === 'months'){
        amountInput.value = Math.max(1, Math.round(amount / 30));
      } else if(lastUnit === 'months' && unitSelect.value === 'days'){
        amountInput.value = Math.max(0, amount * 30);
      }
      lastUnit = unitSelect.value;
    });
  }

  /* ============ Firestore data layer ============ */
  function fsAddVehicle(v){
    return addDoc(collection(db,'vehicles'), v).then(function(ref){ return ref.id; });
  }
  function fsUpdateVehicle(id, fields){
    return updateDoc(doc(db,'vehicles',id), fields);
  }
  function fsUpdateVehiclesForCustomer(vehicles, fields){
    var batch = writeBatch(db);
    vehicles.forEach(function(v){
      batch.update(doc(db,'vehicles',v.id), fields);
    });
    return batch.commit();
  }
  function fsDeleteVehicleCascade(id){
    var q = query(collection(db,'records'), where('vehicleId','==',id));
    return getDocs(q).then(function(snap){
      var batch = writeBatch(db);
      snap.forEach(function(d){ batch.delete(d.ref); });
      batch.delete(doc(db,'vehicles',id));
      return batch.commit();
    });
  }
  function fsAddRecord(r){
    return addDoc(collection(db,'records'), r);
  }
  function fsUpdateRecord(id, fields){
    return updateDoc(doc(db,'records',id), fields);
  }
  function fsDeleteRecord(id){
    return deleteDoc(doc(db,'records',id));
  }
  function fsSaveSettings(fields){
    return setDoc(doc(db,'settings','station'), fields, {merge:true});
  }

  /* ============ Role-aware data subscriptions ============ */
  function teardownDataSubscriptions(){
    if(unsubVehicles){ unsubVehicles(); unsubVehicles=null; }
    if(unsubRecords){ unsubRecords(); unsubRecords=null; }
    state.vehicles = [];
    state.records = [];
    state.subscribedRole = null;
  }

  function subscribeAdmin(){
    unsubVehicles = onSnapshot(collection(db,'vehicles'), function(snap){
      state.vehicles = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ alertError('Vehicles sync error', err); });

    unsubRecords = onSnapshot(collection(db,'records'), function(snap){
      state.records = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      render();
    }, function(err){ alertError('Records sync error', err); });
  }

  function subscribeCustomer(email){
    var q = query(collection(db,'vehicles'), where('customerEmail','==',email));
    unsubVehicles = onSnapshot(q, function(snap){
      state.vehicles = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      var ids = state.vehicles.map(function(v){ return v.id; }).slice(0,10); // Firestore 'in' query max
      if(unsubRecords){ unsubRecords(); unsubRecords=null; }
      if(ids.length){
        var rq = query(collection(db,'records'), where('vehicleId','in',ids));
        unsubRecords = onSnapshot(rq, function(rsnap){
          state.records = rsnap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
          render();
        }, function(err){ alertError('Records sync error', err); });
      } else {
        state.records = [];
      }
      render();
    }, function(err){ alertError('Vehicles sync error', err); });
  }

  function subscribeForRole(){
    var key = state.role + ':' + (state.user ? state.user.uid : '');
    if(state.subscribedRole === key) return;
    teardownDataSubscriptions();
    state.subscribedRole = key;
    if(state.role === 'admin'){
      subscribeAdmin();
    } else if(state.role === 'customer' && state.user){
      subscribeCustomer((state.user.email||'').toLowerCase());
    }
  }

  function resolveRole(){
    if(!state.user){ state.role = null; return; }
    var admins = state.settings.adminEmails || [];
    var email = (state.user.email||'').toLowerCase();
    if(admins.length === 0){
      // Bootstrap: first person to ever sign in becomes the administrator.
      admins = [email];
      setDoc(doc(db,'settings','station'), {adminEmails: admins}, {merge:true}).catch(function(err){
        alertError('Could not set up administrator account', err);
      });
      state.settings.adminEmails = admins;
    }
    state.role = admins.indexOf(email) !== -1 ? 'admin' : 'customer';
    subscribeForRole();
  }

  function subscribeSettings(){
    if(unsubSettings) return;
    unsubSettings = onSnapshot(doc(db,'settings','station'), function(snap){
      if(snap.exists()){
        state.settings = Object.assign(state.settings, snap.data());
        saveSavedSettings(state.settings);
      }
      renderBrand();
      resolveRole();
      render();
    }, function(err){
      // Likely still signed out or rules not yet configured — non-fatal.
      renderBrand();
      render();
    });
  }

  /* ============ Password reset (REST fallback) ============ */
  // firebase-bundle.js is a trimmed build that doesn't include sendPasswordResetEmail,
  // so we call the Identity Toolkit REST API directly with the project's apiKey instead.
  function restSendPasswordResetEmail(apiKey, email){
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=' + encodeURIComponent(apiKey), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ requestType: 'PASSWORD_RESET', email: email })
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        if(!res.ok){
          var code = (data && data.error && data.error.message) || 'REQUEST_FAILED';
          var friendly = {
            EMAIL_NOT_FOUND: 'No account found with that email.',
            INVALID_EMAIL: 'That email address looks invalid.',
            MISSING_EMAIL: 'Enter an email address first.'
          }[code];
          throw new Error(friendly || code);
        }
        return data;
      });
    });
  }

  /* ============ Push notifications (Firebase Cloud Messaging) ============ */
  // firebase-bundle.js doesn't include the Messaging module (it's a trimmed
  // build), so messaging is loaded fresh from the CDN as a separate, named
  // secondary app. It shares the same Firebase project — just a different
  // in-memory SDK instance — so Firestore writes below still go to the same
  // database via the main `db`/`doc`/`setDoc` from the local bundle.
  //
  // IMPORTANT: replace VAPID_KEY with your own before this will work — get it
  // from Firebase Console → Project settings → Cloud Messaging → Web Push
  // certificates → "Generate key pair". See README for the full setup guide.
  var VAPID_KEY = "BG72ypkMVexgOruiTAYZGc-pvGKRkLSm49DDV6ygBO-v6Lk-1h9zFSy296-Wg5babYxoQ38ppT8vpllwBymrDXI";

  async function enableNotifications(){
    var notifyBtn = document.getElementById('notifyBtn');
    if(!('Notification' in window) || !('serviceWorker' in navigator)){
      alertError('Not supported', new Error('This browser does not support push notifications.'));
      return;
    }
    if(!state.user || !state.user.email){
      alertError('Sign in required', new Error('Sign in first, then enable notifications.'));
      return;
    }
    if(VAPID_KEY.indexOf('REPLACE_WITH') === 0){
      alertError('Not configured yet', new Error('The app owner needs to add a Cloud Messaging VAPID key before push notifications will work. See README.'));
      return;
    }
    notifyBtn.disabled = true;
    try{
      var permission = await Notification.requestPermission();
      if(permission !== 'granted'){
        notifyBtn.disabled = false;
        return;
      }
      var msgMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js");
      var appMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      var secondaryApp = appMod.initializeApp(DEFAULT_FIREBASE_CONFIG, 'messaging');
      var messaging = msgMod.getMessaging(secondaryApp);

      // Let Firebase find/register the service worker itself (it automatically
      // looks for /firebase-messaging-sw.js) rather than doing it manually here —
      // manual registration was racing with Firebase's internal state and causing
      // "Cannot read properties of undefined (reading 'pushManager')".
      var token = await msgMod.getToken(messaging, {vapidKey: VAPID_KEY});
      if(!token) throw new Error('Could not get a device token.');

      var email = (state.user.email||'').toLowerCase();
      await setDoc(doc(db, 'pushTokens', token), {
        token: token,
        email: email,
        platform: navigator.userAgent,
        updatedAt: new Date().toISOString()
      });

      // Foreground messages don't auto-show as OS notifications — display them manually.
      msgMod.onMessage(messaging, function(payload){
        var title = (payload.notification && payload.notification.title) || 'Service reminder';
        var body = (payload.notification && payload.notification.body) || '';
        try{ new Notification(title, {body: body, icon: '/favicon.svg'}); }catch(e){}
      });

      renderChrome();
    }catch(err){
      notifyBtn.disabled = false;
      alertError('Could not enable notifications', err);
    }
  }

  /* ============ Firebase connect + auth wiring ============ */
  function connectFirestore(cfg){
    state.dbConnecting = true;
    render();
    try{
      app = initializeApp(cfg);
      db = getFirestore(app);
      auth = getAuth(app);
      activeFirebaseApiKey = cfg && cfg.apiKey ? cfg.apiKey : null;
    }catch(err){
      state.dbConnecting = false;
      render();
      alertError('Could not initialize Firebase', err);
      return;
    }
    state.dbConnected = true;
    state.dbConnecting = false;

    onAuthStateChanged(auth, function(user){
      state.user = user;
      if(user){
        subscribeSettings();
      } else {
        if(unsubSettings){ unsubSettings(); unsubSettings=null; }
        teardownDataSubscriptions();
        state.role = null;
      }
      render();
    });

    render();
  }

  function doSignOut(){
    signOut(auth).catch(function(err){ alertError('Could not sign out', err); });
  }

  /* ============ Export ============ */
  function exportData(){
    var payload = {
      exportedAt: new Date().toISOString(),
      station: state.settings,
      vehicles: state.vehicles,
      records: state.records
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = "service-tracker-export.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ============ Init ============ */
  function applyLangToDocument(){
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  }
  applyLangToDocument();

  document.querySelectorAll('#langSwitch button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var lang = btn.getAttribute('data-lang');
      if(lang === state.lang) return;
      state.lang = lang;
      saveLang(lang);
      applyLangToDocument();
      renderBrand();
      render();
    });
  });

  document.getElementById('addVehicleBtn').addEventListener('click', openAddVehicleModal);
  document.getElementById('addVehicleTile').addEventListener('click', openAddVehicleModal);
  document.getElementById('notifyBtn').addEventListener('click', enableNotifications);
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);
  document.getElementById('dbStatusBtn').addEventListener('click', openFirestoreModal);
  document.getElementById('signOutBtn').addEventListener('click', doSignOut);
  saveSavedSettings(state.settings);
  document.getElementById('navOverview').addEventListener('click', function(){
    state.view = "overview";
    render();
  });
  document.getElementById('navCustomers').addEventListener('click', function(){
    if(!isAdmin()) return;
    state.view = "customers";
    render();
  });

  renderBrand();
  render();
  var existingCfg = loadFirebaseConfig();
  if(existingCfg){
    connectFirestore(existingCfg);
  }

})();
</script>
</body>
